syntax = "proto3";

package ecommerce.order.v1;

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (OrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc GetOrder(GetOrderRequest) returns (OrderResponse);
}

message CreateOrderRequest {
  int32 uid = 1;
  repeated CreateOrderItem items = 2;
  string client_request_id = 3;
}

message CreateOrderItem {
  int32 pid = 1;
  int32 qty = 2;
}

message ListOrdersRequest {
  int32 requester_uid = 1;
  string requester_role = 2;
  int32 page = 3;
  int32 page_size = 4;
  optional int32 customer_uid = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message GetOrderRequest {
  int32 oid = 1;
  int32 requester_uid = 2;
  string requester_role = 3;
}

message OrderResponse {
  Order order = 1;
}

message Order {
  int32 oid = 1;
  int32 uid = 2;
  repeated OrderDetail items = 3;
  string subtotal = 4;
  string discount_percent = 5;
  string discount_amount = 6;
  string total_amount = 7;
  OrderStatus status = 8;
  string created_at = 9;
  string updated_at = 10;
}

message OrderDetail {
  int32 pid = 1;
  string pname = 2;
  int32 qty = 3;
  string unit_price = 4;
  string line_total = 5;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  ORDER_STATUS_CREATED = 1;
  ORDER_STATUS_CANCELLED = 2;
}
